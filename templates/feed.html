<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>мойИПЦ</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>

    <header class="header">
        <a class="logo">
            <span class="logo-icon"><span class="logo-mid"><span class="logo-in"></span></span></span>
            <span class="logo-text"><span class="letter-pink">мойИ</span><span class="letter-orange">П</span><span class="letter-yellow">Ц</span></span>
        </a>
    </header>

    <main class="feed">
        <div class="video-wrapper">
            <video class="video-background" autoplay loop muted playsinline>
                <source src="http://localhost:9000/categories/{{.category.VideoKey}}" type="video/mp4">
            </video>
            <div class="video-overlay"></div>
        </div>

        <div class="feed-info">
            <p><b>Категория:</b> {{ .category.Title }}</p>
            <p><b>Вес в потребительской корзине:</b> {{ .category.BasketWeight }} %</p>
            <p><b>Сумма (год назад):</b> {{ .category.PreviousSum }} руб.</p>

            <p>
                <b>Сумма (сейчас):</b>
                <input type="checkbox" id="more">
                <label for="more"><span class="more-open">…ещё</span><span class="more-close">скрыть</span></label>
                <span class="more-value">{{ .category.TodaySum }} руб. {{ .category.Description }}</span>
            </p>
        </div>

        <div class="feed-like">
            <span class="like-btn">♥</span>
            <span class="like-count">{{ .likesCount }}</span>
        </div>

        <a class="feed-next" href="/feed/{{ .category.ID }}?next=true" title="Следующая категория">↓</a>
    </main>

    <nav class="tabbar">
        <!-- Активная вкладка -->
        <a class="tab active" href="/feed/1">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 8l6 4-6 4z" fill="currentColor"/></svg>
            <span>Лента</span>
        </a>
        <a class="tab" href="/add">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M11 6h2v5h5v2h-5v5h-2v-5H6v-2h5z" fill="#fff"/></svg>
            <span>Добавить</span>
        </a>
        <a class="tab" href="/grid">
            <svg viewBox="0 0 24 24"><path d="M3 4h3l2.5 12h9L21 8H7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="20" r="1.7" fill="currentColor"/><circle cx="17" cy="20" r="1.7" fill="currentColor"/></svg>
            <span>Категории</span>
        </a>
    </nav>

</body>
</html>
