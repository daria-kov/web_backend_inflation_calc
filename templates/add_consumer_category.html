<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>мойИПЦ</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>

<body>
    <header class="header">
        <a class="logo">
            <span class="logo-icon">
                <span class="logo-mid">
                    <span class="logo-in"></span>
                </span>
            </span>
            <span class="logo-text">
                <span class="letter-pink">мойИ</span><span class="letter-orange">П</span><span class="letter-yellow">Ц</span>
            </span>
        </a>
    </header>


    <main class="add">

        {{ if .draft.CategoryID }}

        <form class="add-card" method="POST" action="/publish_consumer_category">
            <h3 class="add-title">Заполните данные</h3>
            <div class="media-block">
                <div class="media-title">
                    Выбранное фото
                </div>
                <div class="upload-box media-preview">
                    <img
                        src="/static/img/default.jpg"
                        alt="Фото категории"
                    >
                </div>

            </div>
            <div class="media-block">
                <div class="media-title">
                    Выбранное видео
                </div>
                <div class="upload-box media-preview">
                    <video
                        autoplay
                        muted
                        loop
                        playsinline
                        src="/static/img/default.mp4">
                    </video>

                </div>
            </div>

            <input
                type="hidden"
                name="category_id"
                value="{{ .draft.CategoryID }}"
            >

            <div class="form-group">

                <label class="form-label" for="category-name">
                    Категория корзины
                </label>

                <input
                    type="text"
                    id="category-name"
                    class="form-input"
                    value="{{ .draft.Title }}"
                    readonly
                >

            </div>


            <div class="form-group">

                <label class="form-label" for="description">
                    Описание
                </label>

                <textarea
                    id="description"
                    name="description"
                    class="form-textarea"
                    rows="3"
                    placeholder="Описание"
                >{{ .draft.Description }}</textarea>

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label class="form-label" for="historical-date">
                        Дата
                    </label>

                    <input
                        type="date"
                        id="historical-date"
                        name="historical_date"
                        class="form-input"
                        value="{{ .draft.HistoricalDate.Format "2006-01-02" }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label class="form-label" for="basket-weight">
                        Вес (в %)
                    </label>

                    <input
                        type="number"
                        id="basket-weight"
                        name="basket_weight"
                        class="form-input"
                        placeholder="0"
                        value="{{ .draft.BasketWeight }}"
                        step="0.01"
                        required
                    >

                </div>

            </div>

            <button
                type="submit"
                class="add-button">
                Опубликовать
            </button>

        </form>


        {{ else }}

        <form class="add-card" method="POST" action="/add_consumer_category">
            <h3 class="add-title">Заполните данные</h3>
            <div class="media-block">
                <div class="media-title">
                    Загрузить фото
                </div>
                <label class="upload-box" for="photo-input">
                    <svg viewBox="0 0 24 24">
                        <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="2"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                        />
                        <circle
                            cx="8.5"
                            cy="8.5"
                            r="1.5"
                            fill="currentColor"
                        />
                        <path
                            d="M21 15l-5-5L5 21"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                        />
                    </svg>
                    <input
                        type="file"
                        id="photo-input"
                        accept="image/*"
                        hidden
                    >
                </label>
            </div>

            <div class="media-block">
                <div class="media-title">
                    Загрузить видео
                </div>
                <label class="upload-box" for="video-input">
                    <svg viewBox="0 0 24 24">
                        <rect
                            x="2"
                            y="4"
                            width="15"
                            height="16"
                            rx="2"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                        />
                        <path
                            d="M17 8l5-3v14l-5-3V8z"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                        />
                    </svg>
                    <input
                        type="file"
                        id="video-input"
                        accept="video/*"
                        hidden
                    >
                </label>
            </div>

            <div class="form-group">

                <label class="form-label" for="category-name">
                    Категория корзины
                </label>

                <input
                    type="text"
                    id="category-name"
                    name="name"
                    class="form-input"
                    placeholder="Введите категорию"
                    required
                >

            </div>

            <button
                type="submit"
                class="add-button">
                Далее
            </button>

        </form>

        {{ end }}

    </main>


    <nav class="tabbar">

        <a class="tab" href="/consumer_categories_feed/1">

            <svg viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="12"
                    r="10"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                />

                <path
                    d="M10 8l6 4-6 4z"
                    fill="currentColor"
                />

            </svg>

            <span>Лента</span>

        </a>


        <a class="tab active" href="/add_consumer_category">

            <svg viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="12"
                    r="10"
                    fill="currentColor"
                />

                <path
                    d="M11 6h2v5h5v2h-5v5h-2v-5H6v-2h5z"
                    fill="#fff"
                />

            </svg>

            <span>Добавить</span>

        </a>


        <a class="tab" href="/consumer_categories">

            <svg viewBox="0 0 24 24">

                <path
                    d="M3 4h3l2.5 12h9L21 8H7"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                />

                <circle
                    cx="10"
                    cy="20"
                    r="1.7"
                    fill="currentColor"
                />

                <circle
                    cx="17"
                    cy="20"
                    r="1.7"
                    fill="currentColor"
                />

            </svg>

            <span>Моя корзина</span>

        </a>

    </nav>

</body>

</html>
