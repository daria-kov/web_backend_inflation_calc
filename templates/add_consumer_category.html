<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>мойИПЦ</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>

    <header class="header">
        <a class="logo">
            <span class="logo-icon"><span class="logo-mid"><span class="logo-in"></span></span></span>
            <span class="logo-text"><span class="letter-pink">мойИ</span><span class="letter-orange">П</span><span class="letter-yellow">Ц</span></span>
        </a>
    </header>

    <main class="add">
        <div class="add-card">
            <h3 class="add-title">Заполните данные</h3>

            <div class="upload-row">
                <label class="upload-box" for="photo-input">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
                        <path d="M21 15l-5-5L5 21" fill="none" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <input type="file" id="photo-input" accept="image/*" hidden>
                </label>
                <label class="upload-box" for="video-input">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="4" width="15" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M17 8l5-3v14l-5-3V8z" fill="none" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <input type="file" id="video-input" accept="video/*" hidden>
                </label>
            </div>

            <div class="form-group">
                <label class="form-label">Категория корзины</label>
                <input type="text" class="form-input" placeholder="Введите категорию" value="{{ .draft.Title }}">
            </div>

            <div class="form-group">
                <label class="form-label">Описание</label>
                <textarea class="form-textarea" rows="3" placeholder="Описание">{{ .draft.Description }}</textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Дата</label>
                    <input type="date" class="form-input" value="{{ .draft.Date }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Вес (в %)</label>
                    <input type="number" class="form-input" placeholder="0" value="{{ .draft.BasketWeight }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Сумма на дату</label>
                    <input type="number" class="form-input" placeholder="0" value="{{ .draft.SumDate }}">
                </div>
            <div class="form-group">
                <label class="form-label">Сумма сейчас</label>
                <input type="number" class="form-input" placeholder="0" value="{{ .draft.SumNow }}">
            </div>

        </div>
    </main>

    <nav class="tabbar">
        <a class="tab" href="/consumer_categories_feed/1">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 8l6 4-6 4z" fill="currentColor"/></svg>
            <span>Лента</span>
        </a>

        <a class="tab active" href="/add_consumer_category">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M11 6h2v5h5v2h-5v5h-2v-5H6v-2h5z" fill="#fff"/></svg>
            <span>Добавить</span>
        </a>
        <a class="tab" href="/consumer_categories">
            <svg viewBox="0 0 24 24"><path d="M3 4h3l2.5 12h9L21 8H7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="20" r="1.7" fill="currentColor"/><circle cx="17" cy="20" r="1.7" fill="currentColor"/></svg>
            <span>Моя корзина</span>
        </a>
    </nav>

</body>
</html>
