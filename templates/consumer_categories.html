<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>мойИПЦ</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>

    <header class="header">
        <a class="logo">
            <span class="logo-icon"><span class="logo-mid"><span class="logo-in"></span></span></span>
            <span class="logo-text"><span class="letter-pink">мойИ</span><span class="letter-orange">П</span><span class="letter-yellow">Ц</span></span>
        </a>
    </header>

    <main class="grid">

        <form class="filter-row" method="GET" action="/consumer_categories">
        <div class="date-input-wrap">
            <label for="date-from" class="calendar-label" title="Выбрать дату">
                <svg class="calendar-icon" viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
            </label>
            <input type="date" id="date-from" name="from" class="date-input" value="{{ .filterFrom }}">
        </div>
        <div class="date-input-wrap">
            <label for="date-to" class="calendar-label" title="Выбрать дату">
                <svg class="calendar-icon" viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
            </label>
            <input type="date" id="date-to" name="to" class="date-input" value="{{ .filterTo }}">
        </div>
        <button type="submit" class="search-btn" aria-label="Поиск">
            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </button>
        </form>

        <div class="cards">
            {{ range .categories }}
            <a href="/consumer_categories_feed/{{ .ID }}" class="card">
                <img src="http://localhost:9000/categories/{{ .ImageKey }}" alt="{{ .Title }}">
                <div class="card-title">{{ .Title }}</div>
                <div class="card-pills">
                    <span class="date-pill">{{ .Date }}</span>
                    <span class="like-pill">
                        <svg viewBox="0 0 24 24">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                        {{ .LikesCount }}
                    </span>
                </div>
            </a>
            {{ end }}
        </div>
    </main>

    <nav class="tabbar">
        <a class="tab" href="/consumer_categories_feed/1">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 8l6 4-6 4z" fill="currentColor"/></svg>
            <span>Лента</span>
        </a>
        <a class="tab" href="/add_consumer_category">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M11 6h2v5h5v2h-5v5h-2v-5H6v-2h5z" fill="#fff"/></svg>
            <span>Добавить</span>
        </a>

        <a class="tab active" href="/consumer_categories">
            <svg viewBox="0 0 24 24"><path d="M3 4h3l2.5 12h9L21 8H7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="20" r="1.7" fill="currentColor"/><circle cx="17" cy="20" r="1.7" fill="currentColor"/></svg>
            <span>Моя корзина</span>
        </a>
    </nav>

</body>
</html>
