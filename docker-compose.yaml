
services:
  adminer:
    container_name: adminer
    image: adminer:latest
    ports:
      - "8081:8080"
    networks:
      - labsproject_default

  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - labsproject_default
    restart: unless-stopped

networks:
  labsproject_default:
    external: true
