<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstrudAstronette</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/style.css">

</head>
<body>

    <!-- ===== ШАПКА ===== -->
    <header class="header">
        <a href="/" class="logo">
            <img src="/static/img/planet.svg" alt="Логотип" class="logo-icon">
            <span class="logo-text">AstrudAstronette</span>
        </a>

        <form action="/" method="GET" class="search-form">
            <input type="text" name="query" class="search-input"
                placeholder="Найти планету" value="{{ .Query }}">
            <button type="submit" class="search-button">
                <img src="/static/img/search.svg" class="loupe-icon">
            </button>
        </form>
    </header>

    <!-- ===== СЕТКА КАРТОЧЕК ===== -->
    <main class="container">
        {{ range .planets }}
        <div class="card">
        <img src="http://localhost:9000/planets/{{ .Picture }}" alt="{{ .Title }}" class="card-image">
        <div class="card-content">
            <h3 class="card-title">{{ .Title }}</h3>
            <span class="divider"></span>
            <div class="planet-information">
                <span class="card-mass">M: {{ .Mass }}</span>
                <span class="card-radius">R: {{ .Radius }}</span>
            </div>
        </div>

            <a href="/order/{{ .ID }}" class="card-button">подробнее</a>
        </div>
        </div>
        {{ end }}
    </main>

    <!-- ===== КОРЗИНА ===== -->
    <a href="/cart" class="cart-button">
        <img src="/static/img/satellite.svg" alt="Корзина" class="cart-icon">
        <div class="count-area">
            {{ if .CartCount }}
                <span class="cart-badge">{{ .CartCount }}</span>
            {{ end }}
        </div>
    </a>

</body>

<footer>
    <div class="footer-team">
        <span>@AstrudAstronette Team</span>
    </div>
</footer>
</html>
